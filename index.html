<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meeple Game Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #status {
      min-height: 70px;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .ready {
      background: #eeeeee;
    }

    .success {
      background: #e8f5e9;
    }

    .error {
      background: #ffebee;
    }

    .disabled {
      opacity: 0.5;
    }

    #notification {
  min-height: 45px;
  margin: 10px 0;
  padding: 10px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  border-radius: 8px;
}

.notification-success {
  background: #e8f5e9;
}

.notification-error {
  background: #ffebee;
}
  </style>
</head>

<body>

<div class="container">

  <h1>🎲 Meeple Scanner</h1>

  <div class="card">

    <label>Staff Name</label>

    <input
      id="staffName"
      placeholder="Enter your name"
    >

    <button onclick="saveStaff()">
      Save Name
    </button>

    <div id="staffDisplay"></div>

  </div>

  <div class="card">

  <button id="startBtn" onclick="startCamera()">
    📷 Start Camera
  </button>

  <div id="reader"></div>

  <button id="scanBtn" onclick="scanCurrentFrame()" disabled>
    🎯 Scan Game
  </button>

  <div id="notification"></div>

  <button id="stopBtn" onclick="stopCamera()" disabled>
    ⏹ Stop Camera
  </button>
  </div>

</div>

<script>

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxmhHdlR0OlkkO5y78hr_VAAGsNZlpKVTxEe322Bgnqlhjuy0-ryBs6TbyNt_IBhcHt/exec";


  let scanner = null;
  let cameraRunning = false;

  let lastDetectedCode = "";
  let detectionTime = 0;


  window.addEventListener("load", function () {

    const saved =
      localStorage.getItem("meepleStaff");

    if (saved) {

      document.getElementById("staffName").value = saved;

      showStaff(saved);

    }

  });


  function saveStaff() {

    const name =
      document.getElementById("staffName").value.trim();

    if (!name) {

      alert("Please enter your name.");

      return;

    }

    localStorage.setItem(
      "meepleStaff",
      name
    );

    showStaff(name);

  }


  function showStaff(name) {

    document.getElementById("staffDisplay").innerHTML =
      "Current staff: <b>" +
      escapeHtml(name) +
      "</b>";

  }


  async function startCamera() {

    const staff =
      localStorage.getItem("meepleStaff");

    if (!staff) {

      alert("Please save staff name first.");

      return;

    }

    if (cameraRunning) {
      return;
    }

    const status =
      document.getElementById("status");

    try {

      scanner =
        new Html5Qrcode("reader");

      await scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },

        function(decodedText) {

          // QR is detected,
          // but NOT recorded automatically.

          lastDetectedCode =
            String(decodedText).trim();

          detectionTime =
            Date.now();

          status.className =
            "ready";

          status.innerHTML =
            "QR ready: " +
            escapeHtml(lastDetectedCode);

        },

        function() {
          // Ignore normal detection errors
        }

      );

      cameraRunning = true;

      document.getElementById("scanBtn").disabled = false;
      document.getElementById("stopBtn").disabled = false;
      document.getElementById("startBtn").disabled = true;

      status.className = "ready";

      status.innerHTML =
        "Camera ready — point at QR";

    } catch (error) {

      console.error(error);

      status.className = "error";

      status.innerHTML =
        "Camera error: " +
        escapeHtml(error.message || String(error));

    }

  }


  function scanCurrentFrame() {

  const notification =
    document.getElementById("notification");

  const staff =
    localStorage.getItem("meepleStaff");

  if (!cameraRunning) {

    showNotification(
      "Camera is not running.",
      false
    );

    return;
  }

  if (!lastDetectedCode) {

    showNotification(
      "No QR detected.",
      false
    );

    return;
  }

  if (Date.now() - detectionTime > 3000) {

    showNotification(
      "Aim at the QR again.",
      false
    );

    lastDetectedCode = "";

    return;
  }

  const gameId =
    lastDetectedCode;

  lastDetectedCode = "";

  detectionTime = 0;

  const url =
    API_URL +
    "?action=scan" +
    "&staff=" +
    encodeURIComponent(staff) +
    "&gameId=" +
    encodeURIComponent(gameId) +
    "&t=" +
    Date.now();

  fetch(url, {
    method: "GET",
    mode: "no-cors",
    cache: "no-store"
  })
  .then(function() {

    showNotification(
      "✓ " + gameId + " scanned",
      true
    );

    if (navigator.vibrate) {
      navigator.vibrate(150);
    }

  })
  .catch(function(error) {

    console.error(error);

    showNotification(
      "Scan failed.",
      false
    );

  });

}

  function showNotification(message, success) {

  const notification =
    document.getElementById("notification");

  notification.innerHTML =
    escapeHtml(message);

  notification.className =
    success
      ? "notification-success"
      : "notification-error";

  setTimeout(function() {

    notification.innerHTML = "";
    notification.className = "";

  }, 2000);
}
  

  async function stopCamera() {

    if (!cameraRunning || !scanner) {
      return;
    }

    const status =
      document.getElementById("status");

    try {

      await scanner.stop();

      await scanner.clear();

      cameraRunning = false;

      scanner = null;

      lastDetectedCode = "";

      detectionTime = 0;

      document.getElementById("scanBtn").disabled = true;
      document.getElementById("stopBtn").disabled = true;
      document.getElementById("startBtn").disabled = false;

      status.className =
        "ready";

      status.innerHTML =
        "Camera is off";

    } catch (error) {

      console.error(error);

      status.className =
        "error";

      status.innerHTML =
        "Could not stop camera.";

    }

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
