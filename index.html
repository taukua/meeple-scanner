<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meeple Game Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #status {
      min-height: 70px;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      background: #e8f5e9;
    }

    .error {
      background: #ffebee;
    }

    .ready {
      background: #eeeeee;
    }

    #staffDisplay {
      font-size: 18px;
      margin-bottom: 12px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🎲 Meeple Scanner</h1>


  <div class="card">

    <label>Staff Name</label>

    <input
      id="staffName"
      placeholder="Enter your name"
    >

    <button onclick="saveStaff()">
      Save Name
    </button>

    <div
      id="staffDisplay"
      style="margin-top: 15px;">
    </div>

  </div>


  <div class="card">

    <button onclick="startScanner()">
      📷 Start Scanner
    </button>

    <div id="reader"></div>

    <div
      id="status"
      class="ready">
      Scanner not started
    </div>

  </div>

</div>


<script>

  // ===================================
  // PUT YOUR APPS SCRIPT URL HERE
  // ===================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbx_ikKGCS4n8_zhOZHQGxAP8DLz1_FVKrIUjEMmQg9-UakVY8lw6bEhiWr4s8BC08cu7A/exec";


  let scanner = null;

  let scanning = false;

  let lastScannedCode = "";

  let lastScannedTime = 0;


  // Load saved staff name

  window.addEventListener("load", function () {

    const saved =
      localStorage.getItem("meepleStaff");

    if (saved) {

      document.getElementById(
        "staffName"
      ).value = saved;

      showStaff(saved);
    }

  });


  function saveStaff() {

    const name =
      document.getElementById(
        "staffName"
      ).value.trim();

    if (!name) {
      alert("Please enter your name.");
      return;
    }

    localStorage.setItem(
      "meepleStaff",
      name
    );

    showStaff(name);

  }


  function showStaff(name) {

    document.getElementById(
      "staffDisplay"
    ).innerHTML =
      "Current staff: <b>" +
      escapeHtml(name) +
      "</b>";

  }


  async function startScanner() {

    const staff =
      localStorage.getItem("meepleStaff");

    if (!staff) {

      alert(
        "Please enter and save your name first."
      );

      return;
    }


    if (scanning) {
      return;
    }


    const status =
      document.getElementById(
        "status"
      );


    if (
      typeof Html5Qrcode === "undefined"
    ) {

      status.className = "error";

      status.innerHTML =
        "QR scanner library failed to load.";

      return;
    }


    try {

      scanner =
        new Html5Qrcode("reader");


      await scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },

        onScanSuccess,

        function () {
          // Normal scan failures are ignored.
        }

      );


      scanning = true;

      status.className = "ready";

      status.innerHTML =
        "Ready — point camera at a game QR";


    } catch (error) {

      console.error(error);

      status.className = "error";

      status.innerHTML =
        "Camera error: " +
        escapeHtml(
          error.message ||
          String(error)
        );

    }

  }


  function onScanSuccess(decodedText) {

    const gameId =
      String(decodedText).trim();

    const now =
      Date.now();


    // Prevent the camera from recording
    // the same QR repeatedly.

    if (
      gameId === lastScannedCode &&
      now - lastScannedTime < 10000
    ) {

      return;

    }


    lastScannedCode =
      gameId;

    lastScannedTime =
      now;


    recordGame(gameId);

  }


  function recordGame(gameId) {

    const staff =
      localStorage.getItem(
        "meepleStaff"
      );


    const status =
      document.getElementById(
        "status"
      );


    status.className =
      "success";

    status.innerHTML =
      "✓ " +
      escapeHtml(gameId) +
      " recorded";


    if (navigator.vibrate) {

      navigator.vibrate(150);

    }


    const url =
      API_URL +

      "?action=scan" +

      "&staff=" +
      encodeURIComponent(staff) +

      "&gameId=" +
      encodeURIComponent(gameId) +

      "&t=" +
      Date.now();


    // Send to Apps Script.
    // We do not need to read its response.

    fetch(url, {

      method: "GET",

      mode: "no-cors",

      cache: "no-store"

    }).catch(function (error) {

      console.error(
        "Logging error:",
        error
      );

    });


    setTimeout(function () {

      status.className =
        "ready";

      status.innerHTML =
        "Ready for next game";

    }, 1500);

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
